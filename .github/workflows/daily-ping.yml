# Simulated request to your render project so that the service doesn't go down
name: Keep-Alive Ping

on:
  schedule:
    - cron: '*/14 * * * *'  # Runs every 14 minutes to prevent Render 15-min sleep
  workflow_dispatch:  # Allows manual triggering

jobs:
  curl-website:
    runs-on: ubuntu-latest

    steps:
      - name: Run cURL on Website
        run: curl -I https://www.itevnit.com/
