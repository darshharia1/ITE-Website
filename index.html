<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ITE Startup Launch Pad – A centralized platform managing the entire ITE entrepreneurship journey at VNIT Nagpur, from idea to impact.">
  <meta name="keywords" content="ITE, VNIT, Startup, Entrepreneurship, Launch Pad, Nagpur">
  <title>ITE Startup Launch Pad | VNIT Nagpur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="js/theme.js"></script>
  <style>
    /* Loading spinner for dashboard route transitions */
    .loading-state {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 60vh;
      color: var(--text-secondary);
      font-size: .95rem;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div id="toast-container" aria-live="polite" aria-atomic="false"></div>
    <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true"></div>

    <div id="app-shell" class="app-shell">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar hidden" role="navigation" aria-label="Main navigation">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <svg width="30" height="30" viewBox="0 0 100 110" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M50 5 L95 85 L72 85 L72 68 L28 68 L28 85 L5 85 Z" fill="#2563EB"/>
              <path d="M50 32 L67 65 L33 65 Z" fill="white"/>
            </svg>
            <span class="sidebar-title">ITE Launch Pad</span>
          </div>
          <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Toggle sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>
        <nav id="sidebar-nav" class="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <div id="sidebar-user" class="sidebar-user"></div>
          <button id="logout-btn" class="sidebar-logout-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <!-- Main wrapper -->
      <div id="main-wrapper" class="main-wrapper">
        <header id="topbar" class="topbar hidden" role="banner">
          <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open navigation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div id="topbar-title" class="topbar-title">Dashboard</div>
          <div class="topbar-actions">
            <button id="theme-toggle-app" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle light/dark mode">
              <svg class="sun-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <svg class="moon-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
          </div>
        </header>
        <main id="page-content" class="page-fade" role="main"></main>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/pages/mentor.js"></script>
  <script src="js/pages/student.js"></script>
  <script src="js/pages/about.js"></script>
  <script src="js/dashboardRouter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
